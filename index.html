<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Frame MP4 (Otimizado < 32KB)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
            --input-bg: #0d1117;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #f0f6fc;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="file"], input[type="url"] {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input[type="file"]::file-selector-button {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .tabs {
            display: flex;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 600;
            color: #8b949e;
            flex: 1;
            text-align: center;
        }

        .tab.active {
            color: #f0f6fc;
            border-bottom-color: #58a6ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        button.action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #8b949e;
            word-break: break-all;
        }

        .result-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: none;
        }

        .preview-container {
            margin-bottom: 12px;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .info-size {
            font-size: 0.85rem;
            color: #58a6ff;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .actions button {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }

        .actions button:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Extrator de Frame MP4 (< 32KB)</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('link')">Link Direto</div>
            <div class="tab" onclick="switchTab('file')">Arquivo Local (PC)</div>
        </div>

        <!-- Aba Link -->
        <div id="tab-link" class="tab-content active">
            <div class="form-group">
                <label for="videoUrl">Cole o link direto do .mp4</label>
                <input type="url" id="videoUrl" placeholder="https://exemplo.com/video.mp4">
            </div>
            <button class="action-btn" id="extractLinkBtn" onclick="processarLinkComProxySeguro()">Extrair e Otimizar Frame</button>
        </div>

        <!-- Aba Arquivo Local -->
        <div id="tab-file" class="tab-content">
            <div class="form-group">
                <label for="videoFile">Selecione o arquivo .mp4 do PC</label>
                <input type="file" id="videoFile" accept="video/mp4,video/webm">
            </div>
            <button class="action-btn" id="extractFileBtn" onclick="processarArquivoLocal()">Extrair e Otimizar Frame</button>
        </div>
        
        <div id="status" class="status"></div>

        <div id="resultSection" class="result-section">
            <div class="preview-container">
                <label>Pré-visualização:</label>
                <canvas id="canvasOutput"></canvas>
                <div id="sizeInfo" class="info-size"></div>
            </div>
            
            <div class="form-group">
                <label for="base64Output">Código Base64 Otimizado:</label>
                <textarea id="base64Output" readonly></textarea>
            </div>

            <div class="actions">
                <button onclick="copiarBase64()">Copiar Base64</button>
                <button onclick="baixarImagem()">Baixar Imagem</button>
            </div>
        </div>
    </div>

    <video id="hiddenVideo" style="display:none;"></video>

    <script>
        let imagemBase64Global = "";

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tabName === 'link') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-link').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-file').classList.add('active');
            }
            document.getElementById('status').innerText = '';
            document.getElementById('resultSection').style.display = 'none';
        }

        function atualizarStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        async function processarLinkComProxySeguro() {
            const url = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('extractLinkBtn');
            if (!url) {
                alert('Insira um link válido.');
                return;
            }

            btn.disabled = true;
            atualizarStatus('Baixando trecho do vídeo via proxy seguro...');

            const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(url);

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Servidor recusou a transferência.');

                atualizarStatus('Carregando na RAM local...');
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                executarExtracao(blobUrl, 'extractLinkBtn', true);

            } catch (error) {
                atualizarStatus('Erro: O servidor de destino bloqueou o acesso. Use a aba "Arquivo Local".');
                btn.disabled = false;
            }
        }

        function processarArquivoLocal() {
            const fileInput = document.getElementById('videoFile');
            if (fileInput.files.length === 0) {
                alert('Selecione um arquivo.');
                return;
            }
            const file = fileInput.files[0];
            const blobUrl = URL.createObjectURL(file);
            executarExtracao(blobUrl, 'extractFileBtn', true);
        }

        function executarExtracao(videoSource, btnId, isBlobUrl) {
            const btn = document.getElementById(btnId);
            const video = document.getElementById('hiddenVideo');
            const resultSection = document.getElementById('resultSection');

            resultSection.style.display = 'none';

            video.src = videoSource;
            video.load();

            video.onloadedmetadata = function() {
                const tempoMeio = video.duration / 2;
                atualizarStatus(`Duração: ${video.duration.toFixed(2)}s. Capturando frame do meio (${tempoMeio.toFixed(2)}s)...`);
                video.currentTime = tempoMeio;
            };

            video.onseeked = function() {
                try {
                    const canvas = document.getElementById('canvasOutput');
                    const ctx = canvas.getContext('2d');

                    // Definimos uma largura máxima inteligente (ex: 480px) para manter a nitidez dos textos 
                    // e garantir que o tamanho final em Base64 fique estritamente abaixo de 32 KB.
                    const MAX_WIDTH = 480;
                    let larguraOriginal = video.videoWidth;
                    let alturaOriginal = video.videoHeight;

                    if (larguraOriginal > MAX_WIDTH) {
                        canvas.width = MAX_WIDTH;
                        canvas.height = Math.floor((alturaOriginal * MAX_WIDTH) / larguraOriginal);
                    } else {
                        canvas.width = larguraOriginal;
                        canvas.height = alturaOriginal;
                    }

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // Geramos como JPEG com qualidade 0.82 (excelente balanço entre alta legibilidade e peso reduzido)
                    imagemBase64Global = canvas.toDataURL('image/jpeg', 0.82);
                    
                    // Cálculo exato do tamanho em KB da string Base64 gerada
                    const tamanhoBytes = (imagemBase64Global.length * (3/4)) - (imagemBase64Global.endsWith('==') ? 2 : imagemBase64Global.endsWith('=') ? 1 : 0);
                    const tamanhoKb = (tamanhoBytes / 1024).toFixed(2);

                    document.getElementById('base64Output').value = imagemBase64Global;
                    document.getElementById('sizeInfo').innerText = `Tamanho final estimado: ${tamanhoKb} KB (Meta: < 32 KB)`;
                    
                    resultSection.style.display = 'block';
                    atualizarStatus('Frame extraído e otimizado com sucesso!');
                } catch (e) {
                    atualizarStatus('Erro ao processar os pixels no Canvas.');
                }
                btn.disabled = false;
                if (isBlobUrl) URL.revokeObjectURL(videoSource);
            };

            video.onerror = function() {
                atualizarStatus('Erro ao ler o arquivo de vídeo.');
                btn.disabled = false;
                if (isBlobUrl) URL.revokeObjectURL(videoSource);
            };
        }

        function copiarBase64() {
            const textarea = document.getElementById('base64Output');
            textarea.select();
            document.execCommand('copy');
            alert('Base64 copiado!');
        }

        function baixarImagem() {
            if (!imagemBase64Global) return;
            const a = document.createElement('a');
            a.href = imagemBase64Global;
            a.download = 'frame-otimizado.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
