<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Frame em Base64</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
            --input-bg: #0d1117;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #f0f6fc;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="url"] {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #8b949e;
        }

        .result-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: none;
        }

        .preview-container {
            margin-bottom: 12px;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .actions button {
            background-color: #21262d;
            border: 1px solid var(--border-color);
        }

        .actions button:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Extrator de Frame MP4 (Base64)</h1>
        
        <div class="form-group">
            <label for="videoUrl">Link Direto do Vídeo (.mp4)</label>
            <input type="url" id="videoUrl" placeholder="https://exemplo.com/video.mp4" autocomplete="off">
        </div>

        <button id="extractBtn" onclick="extrairFrameDoMeio()">Extrair Frame do Meio</button>
        
        <div id="status" class="status"></div>

        <div id="resultSection" class="result-section">
            <div class="preview-container">
                <label>Pré-visualização do Frame Capturado:</label>
                <canvas id="canvasOutput"></canvas>
            </div>
            
            <div class="form-group">
                <label for="base64Output">Código Base64:</label>
                <textarea id="base64Output" readonly></textarea>
            </div>

            <div class="actions">
                <button onclick="copiarBase64()">Copiar Base64</button>
                <button onclick="baixarImagem()">Baixar Imagem (PNG)</button>
            </div>
        </div>
    </div>

    <!-- Vídeo oculto usado para processamento -->
    <video id="hiddenVideo" crossorigin="anonymous" style="display:none;"></video>

    <script>
        let imagemBase64Global = "";

        function atualizarStatus(mensagem) {
            document.getElementById('status').innerText = mensagem;
        }

        function extrairFrameDoMeio() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('extractBtn');
            const video = document.getElementById('hiddenVideo');
            const resultSection = document.getElementById('resultSection');

            if (!urlInput) {
                alert('Por favor, insira um link de vídeo válido.');
                return;
            }

            resultSection.style.display = 'none';
            btn.disabled = true;
            atualizarStatus('Carregando metadados do vídeo...');

            video.src = urlInput;
            video.load();

            // Evento disparado quando o navegador já sabe a duração e dimensões do vídeo
            video.onloadedmetadata = function() {
                const tempoMeio = video.duration / 2;
                atualizarStatus(`Vídeo carregado. Duração: ${video.duration.toFixed(2)}s. Pulando para o meio (${tempoMeio.toFixed(2)}s)...`);
                video.currentTime = tempoMeio;
            };

            // Evento disparado quando o vídeo consegue posicionar o tempo exato solicitado
            video.onseeked = function() {
                atualizarStatus('Capturando frame...');
                
                const canvas = document.getElementById('canvasOutput');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Converter o canvas para formato Base64 (PNG)
                imagemBase64Global = canvas.toDataURL('image/png');
                
                document.getElementById('base64Output').value = imagemBase64Global;
                resultSection.style.display = 'block';
                atualizarStatus('Frame extraído com sucesso!');
                btn.disabled = false;
            };

            // Tratamento de erro de link ou CORS
            video.onerror = function() {
                atualizarStatus('Erro ao carregar o vídeo. Verifique se o link está correto e se o servidor permite acesso externo (CORS).');
                btn.disabled = false;
            };
        }

        function copiarBase64() {
            const textarea = document.getElementById('base64Output');
            textarea.select();
            document.execCommand('copy');
            alert('Código Base64 copiado para a área de transferência!');
        }

        function baixarImagem() {
            if (!imagemBase64Global) return;
            const a = document.createElement('a');
            a.href = imagemBase64Global;
            a.download = 'frame-meio-video.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
